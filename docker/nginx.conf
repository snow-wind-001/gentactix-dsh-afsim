worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/gentactix-nginx.pid;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    client_body_temp_path /tmp/gentactix-client;
    proxy_temp_path /tmp/gentactix-proxy;
    fastcgi_temp_path /tmp/gentactix-fastcgi;
    uwsgi_temp_path /tmp/gentactix-uwsgi;
    scgi_temp_path /tmp/gentactix-scgi;
    map $host $local_host {
        default 0;
        localhost 1;
        127.0.0.1 1;
        "::1" 1;
        "[::1]" 1;
    }
    server {
        listen 8080;
        server_name localhost 127.0.0.1;
        if ($local_host = 0) { return 403; }
        root /app/frontend-dist;
        index index.html;
        client_max_body_size 128m;
        location /api/ {
            proxy_pass http://127.0.0.1:8700;
            proxy_set_header Host 127.0.0.1:8700;
            proxy_set_header Origin $http_origin;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_buffering off;
            proxy_read_timeout 1900s;
            proxy_send_timeout 1900s;
        }
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }
        location = /container-config.js {
            add_header Cache-Control "no-store";
            try_files $uri =404;
        }
        location / { try_files $uri $uri/ /index.html; }
    }
}
