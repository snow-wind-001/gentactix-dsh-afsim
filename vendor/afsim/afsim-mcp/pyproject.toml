[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "afsim-mcp"
version = "0.1.0"
description = "MCP server for the AFSIM simulation framework"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
# The core/tools/transport implementation only uses the standard library.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
afsim-mcp = "transport.stdio:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "tools*", "transport*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
